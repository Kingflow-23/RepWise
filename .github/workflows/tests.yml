name: Tests

# Run the offline test suite on every push and on every pull request to main.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # sentence-transformers pulls in PyTorch; the CPU-only build is much
      # smaller and faster to install than the default CUDA one.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # Live tests (Ollama, Photon) stay skipped: REPWISE_LIVE_TESTS is not set.
      - name: Run tests
        run: python -m pytest -q
